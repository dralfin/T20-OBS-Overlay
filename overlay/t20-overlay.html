<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>T20 OBS Overlay</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<style>
/* Fonte gótica do título da HUD (carrega do Google Fonts; se estiver offline cai na fonte reserva) */
@import url("https://fonts.googleapis.com/css2?family=Pirata+One&display=swap");

/* ---------- Modo overlay: some a interface do Foundry, fundo transparente ---------- */
html.t20-obs-on,
html.t20-obs-on body {
  background: transparent !important;
}
body.t20-obs-on > *:not(#t20-obs-overlay):not(script):not(style):not(link) {
  display: none !important;
}

#t20-obs-overlay {
  --ivory: #f7efe0;
  --gold: #e9c987;
  --ink: rgba(24, 0, 0, 0.72);
  --edge: rgba(255, 120, 100, 0.38);
  --display: "Pirata One", "Modesto Condensed", Georgia, serif;
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 99999;
  pointer-events: none;
}

.t20obs-stage {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  transform-origin: 0 0;
  font-family: "Signika", "Segoe UI", sans-serif;
  color: var(--ivory);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
}

#t20-obs-overlay .slot {
  position: absolute;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}
#t20-obs-overlay .slot .info { display: flex; flex-direction: column; box-sizing: border-box; }

/* ---------- Faixa de status (ícone + barra) ---------- */
#t20-obs-overlay .strip { display: flex; align-items: center; gap: 9px; }
#t20-obs-overlay .grp { display: flex; align-items: center; min-width: 0; flex: 1 1 0; }
#t20-obs-overlay .ico { flex: none; position: relative; z-index: 2; width: calc(var(--bh, 21px) + 7px); height: calc(var(--bh, 21px) + 7px); filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.7)); }
#t20-obs-overlay .bar {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  margin-left: -7px;
  border-radius: 0 3px 3px 0;
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.45));
  border: 1px solid rgba(255, 255, 255, 0.12);
}
#t20-obs-overlay .bar .fill { position: absolute; inset: 0 auto 0 0; opacity: 0.85; }
#t20-obs-overlay .pv .fill { background: linear-gradient(90deg, #8e1212, #e0392f); }
#t20-obs-overlay .pm .fill { background: linear-gradient(90deg, #1b3f96, #4a9be8); }
#t20-obs-overlay .pv.low .fill { background: linear-gradient(90deg, #5e0707, #b81d16); }
#t20-obs-overlay .bar .val {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  line-height: 1;
  color: #fff;
  white-space: nowrap;
  text-shadow: 0 0 3px #000, 0 1px 2px #000;
}
#t20-obs-overlay .bar .val i { font-style: normal; opacity: 0.7; margin: 0 2px; }
#t20-obs-overlay .def .bar { background: linear-gradient(90deg, rgba(0, 0, 0, 0.88), rgba(110, 110, 110, 0.55)); border-color: rgba(233, 201, 135, 0.35); }

/* ---------- Animações das barras ---------- */
#t20-obs-overlay .grp { position: relative; }
#t20-obs-overlay .bar .ghost { position: absolute; inset: 0 auto 0 0; width: 0; }
#t20-obs-overlay .bar .ghost.loss { background: linear-gradient(90deg, #ffd9b0, #fff3e0); }
#t20-obs-overlay .pv .bar .ghost.gain { background: linear-gradient(90deg, #7fe88a, #c9ffcf); }
#t20-obs-overlay .pm .bar .ghost.gain { background: linear-gradient(90deg, #8fd8ff, #d8f1ff); }
#t20-obs-overlay .bar .fill { z-index: 1; }
#t20-obs-overlay .bar .val { z-index: 2; }

#t20-obs-overlay .bar.hit { animation: t20-shake 0.4s ease-out, t20-hit 0.8s ease-out; }
#t20-obs-overlay .pv .bar.heal { --glow: 90, 255, 120; animation: t20-heal 0.9s ease-out; }
#t20-obs-overlay .pm .bar.heal { --glow: 120, 200, 255; animation: t20-heal 0.9s ease-out; }
#t20-obs-overlay .grp.pv.low .fill { animation: t20-lowpulse 1.1s ease-in-out infinite; }
#t20-obs-overlay .val.pop { animation: t20-pop 0.5s ease-out; }
#t20-obs-overlay .slot.enter { animation: t20-in 0.5s ease-out both; }

#t20-obs-overlay .delta {
  position: absolute;
  right: 3px;
  top: -3px;
  z-index: 5;
  font-weight: 800;
  pointer-events: none;
  text-shadow: 0 0 4px #000, 0 1px 3px #000;
  animation: t20-float 1.5s ease-out forwards;
}
#t20-obs-overlay .delta.neg { color: #ff6b5e; }
#t20-obs-overlay .delta.pos { color: #7dff8a; }
#t20-obs-overlay .pm .delta.pos { color: #8fd8ff; }
#t20-obs-overlay .tela1 .delta { font-size: 18px; }
#t20-obs-overlay .tela2 .delta { font-size: 15px; }

@keyframes t20-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-3px); } 40% { transform: translateX(3px); } 60% { transform: translateX(-2px); } 80% { transform: translateX(1px); } }
@keyframes t20-hit { 0% { box-shadow: 0 0 0 0 rgba(255, 70, 50, 0.95), inset 0 0 14px rgba(255, 90, 70, 0.9); } 100% { box-shadow: 0 0 16px 5px rgba(255, 70, 50, 0), inset 0 0 0 rgba(255, 90, 70, 0); } }
@keyframes t20-heal { 0% { box-shadow: 0 0 0 0 rgba(var(--glow), 0.9), inset 0 0 14px rgba(var(--glow), 0.8); } 100% { box-shadow: 0 0 16px 5px rgba(var(--glow), 0), inset 0 0 0 rgba(var(--glow), 0); } }
@keyframes t20-lowpulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.45; } }
@keyframes t20-pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); color: #ffe27a; } 100% { transform: scale(1); } }
@keyframes t20-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes t20-float { 0% { opacity: 0; transform: translateY(6px) scale(0.8); } 15% { opacity: 1; transform: translateY(-4px) scale(1.15); } 100% { opacity: 0; transform: translateY(-32px) scale(1); } }

/* ---------- Vida/mana temporária: número sobre o ícone ---------- */
#t20-obs-overlay .tmp {
  position: absolute; left: 0; top: 50%; z-index: 4;
  width: calc(var(--bh, 21px) + 7px); transform: translateY(-50%);
  text-align: center; font-weight: 800; line-height: 1;
  font-size: calc(var(--bh, 21px) * 0.62);
  font-family: var(--font-num, "Signika", "Segoe UI", sans-serif);
  color: #fff6c8; pointer-events: none;
  text-shadow: 0 0 2px #000, 0 0 3px #000, 0 1px 2px #000, 0 0 6px rgba(255, 210, 90, 0.9);
}
#t20-obs-overlay .tmp[hidden] { display: none; }
#t20-obs-overlay .tmp.tgain { animation: t20-tgain 0.6s ease-out; }
#t20-obs-overlay .tmp.tloss { animation: t20-tloss 0.7s ease-out; }
#t20-obs-overlay .tmp.tbreak { animation: t20-tbreak 0.75s ease-in forwards; }
#t20-obs-overlay .burst {
  position: absolute; left: 0; top: 50%; z-index: 3; pointer-events: none;
  width: calc(var(--bh, 21px) + 7px); height: calc(var(--bh, 21px) + 7px); margin-top: calc((var(--bh, 21px) + 7px) / -2);
  border-radius: 50%; border: 2px solid #ffd45a; box-shadow: 0 0 8px 2px rgba(255, 200, 70, 0.8);
  animation: t20-burst 0.75s ease-out forwards;
}
#t20-obs-overlay .delta.tmpd { color: #ffe27a; }
@keyframes t20-tgain { 0% { transform: translateY(-50%) scale(0.3); opacity: 0; } 60% { transform: translateY(-50%) scale(1.5); opacity: 1; } 100% { transform: translateY(-50%) scale(1); } }
@keyframes t20-tloss { 0% { transform: translateY(-50%) scale(1.7) rotate(0); color: #fff; } 20% { transform: translateY(-50%) scale(1.4) rotate(-14deg); } 40% { transform: translateY(-50%) scale(1.2) rotate(12deg); } 60% { transform: translateY(-50%) scale(1.1) rotate(-6deg); } 100% { transform: translateY(-50%) scale(1) rotate(0); } }
@keyframes t20-tbreak { 0% { transform: translateY(-50%) scale(1.3); opacity: 1; filter: none; } 25% { transform: translateY(-50%) scale(1.5) rotate(-12deg); } 55% { transform: translateY(-85%) scale(1.1) rotate(14deg); opacity: .8; filter: blur(0.5px); } 100% { transform: translateY(-160%) scale(0.5) rotate(30deg); opacity: 0; filter: blur(2px); } }
@keyframes t20-burst { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(2.4); opacity: 0; border-width: 0; } }

/* ---------- Efeitos ativos (opcional): etiquetas com o nome ---------- */
#t20-obs-overlay .fx { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
#t20-obs-overlay .fx:empty { display: none; }
#t20-obs-overlay .tag {
  padding: 1px 7px; border-radius: 9px; font-size: 13px; font-weight: 700; line-height: 1.25; white-space: nowrap;
  color: #fff4e0; background: linear-gradient(180deg, rgba(120, 20, 20, 0.92), rgba(60, 0, 0, 0.92));
  border: 1px solid rgba(255, 150, 120, 0.55); text-shadow: 0 1px 2px #000;
}
#t20-obs-overlay .tag.new { animation: t20-in 0.4s ease-out both; }
#t20-obs-overlay .tela2 .tag, #t20-obs-overlay.tela2 .tag { font-size: 11px; padding: 0 5px; }

/* ---------- Nome (opcional) ---------- */
#t20-obs-overlay .nm {
  margin-top: 5px;
  font-family: var(--font-name, var(--display));
  color: #fff;
  line-height: 1.05;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- TELA 1 — topo de cada painel do Séquito ---------- */
#t20-obs-overlay .tela1 .slot { padding: 3px 1px 0 5px; }
#t20-obs-overlay .bar { height: var(--bh, 21px); }
#t20-obs-overlay .bar .val { font-size: var(--fs, 14px); }
#t20-obs-overlay .bar .val, #t20-obs-overlay .delta { font-family: var(--font-num, "Signika", "Segoe UI", sans-serif); }
#t20-obs-overlay .tela1 .nm { font-size: 24px; }

/* ---------- TELA 2 — topo de cada câmera ---------- */
#t20-obs-overlay .tela2 .slot { padding: 3px 3px 0 3px; }
#t20-obs-overlay .tela2 .strip { gap: 6px; }
#t20-obs-overlay .tela2 .bar { margin-left: -6px; }
#t20-obs-overlay .tela2 .val i { margin: 0 1px; }
#t20-obs-overlay .tela2 .nm { font-size: 17px; text-shadow: 0 1px 4px #000, 0 0 6px #000; }

/* ---------- Janela de configuração (GM) ---------- */
/* A janela nunca passa da altura da tela; o conteúdo rola dentro dela */
.t20obs-config { max-height: calc(100vh - 40px); }
.t20obs-config .window-content { padding: 12px 14px; gap: 8px; min-height: 0; overflow-x: hidden; overflow-y: auto; }
.t20obs-cfg-hint { margin: 0 0 4px; font-size: 13px; opacity: 0.85; }
.t20obs-cfg-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid rgba(128, 128, 128, 0.3); }
.t20obs-cfg-num {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; background: #650000; color: #fff;
}
.t20obs-cfg-main { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.t20obs-cfg-footer { display: flex; gap: 8px; justify-content: space-between; margin-top: 6px; }
.t20obs-cfg-footer button { flex: 1; }

/* ---------- Janela de posição e largura (GM) ---------- */
.t20obs-lay-h { margin: 10px 0 0; padding-bottom: 3px; font-size: 13px; border-bottom: 1px solid rgba(128, 128, 128, 0.4); }
.t20obs-lay-fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.t20obs-lay-fonts label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; }
.t20obs-lay-fonts input { width: 100%; }
.t20obs-lay-fontbox { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.t20obs-lay-file { display: flex; align-items: center; gap: 4px; font-size: 11px; }
.t20obs-lay-file span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.85; }
.t20obs-lay-file button { flex: none; padding: 0 6px; line-height: 22px; }
.t20obs-lay-elab { flex: none; width: 92px; font-size: 12px; font-weight: 700; }
.t20obs-lay-tabs { display: flex; gap: 6px; }
.t20obs-lay-tabs button { flex: 1; }
.t20obs-lay-tabs button.active { background: #650000; color: #fff; border-color: #a50f0f; }
.t20obs-lay-prev {
  position: relative;
  width: 480px;
  height: 270px;
  margin: 4px auto;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(128, 128, 128, 0.5);
  flex: none;
}
.t20obs-lay-rect {
  position: absolute;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(165, 15, 15, 0.55);
  border: 1px solid #ff6a5c;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}
.t20obs-lay-row { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid rgba(128, 128, 128, 0.3); }
.t20obs-lay-field { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 2px 6px; align-items: center; min-width: 0; }
.t20obs-lay-field span { grid-column: 1 / 3; font-size: 11px; opacity: 0.8; }
.t20obs-lay-field input[type="range"] { min-width: 0; width: 100%; margin: 0; }
.t20obs-lay-field input[type="number"] { width: 54px; padding: 0 2px; }

</style></head><body>
<script>window.T20OBS_VERSION = "3.7.1";</script>
<script>
/* Renderização do overlay. Não depende do Foundry: recebe um "payload" simples
   ({ slots, showNames, scenes, scene }) e desenha. É usado tanto dentro do Foundry
   quanto na página independente (overlay/t20-overlay.html, gerada por tools/build-overlay.py). */

const esc = (s) =>
  String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Geometria (px, base 1920x1080) de cada slot em cada tela.
   Tela 1: área de texto dos painéis da HUD "Séquito" (o retrato fica na arte de fundo).
   Tela 2: os 5 quadrados das câmeras. Ajuste aqui se mudar o layout. */
const GEOMETRY = {
  tela1: [
    { x: 175, y: 370, w: 346, h: 257 },
    { x: 862, y: 370, w: 346, h: 257 },
    { x: 43, y: 698, w: 346, h: 256 },
    { x: 519, y: 698, w: 346, h: 256 },
    { x: 994, y: 698, w: 346, h: 256 }
  ],
  tela2: [35, 318, 600, 882, 1163].map((x) => ({ x, y: 766, w: 267, h: 258 }))
};

/** Layout salvo de uma tela, normalizado (aceita o formato antigo: só a lista de slots). */
function screenLayout(layout, screen) {
  const s = layout?.[screen];
  if (Array.isArray(s)) return { slots: s, elems: {} };
  return { slots: s?.slots ?? [], elems: s?.elems ?? {} };
}

/** Padrão de cada elemento: w = largura em px (0 = automática), h = altura da barra, fs = tamanho da fonte. */
const DEFAULT_ELEMS = {
  tela1: { pv: { w: 0, h: 21, fs: 14 }, pm: { w: 0, h: 21, fs: 14 }, def: { w: 0, h: 21, fs: 14 }, nm: { fs: 24 } },
  tela2: { pv: { w: 0, h: 18, fs: 12 }, pm: { w: 0, h: 18, fs: 12 }, def: { w: 0, h: 18, fs: 12 }, nm: { fs: 17 } }
};

/** Elementos efetivos da tela: padrão + ajustes salvos. */
function elemsFor(screen, layout) {
  const saved = screenLayout(layout, screen).elems;
  const out = {};
  for (const [k, d] of Object.entries(DEFAULT_ELEMS[screen])) {
    out[k] = { ...d };
    for (const f of Object.keys(d)) {
      const v = saved?.[k]?.[f];
      if (v !== null && v !== undefined && v !== "" && Number.isFinite(Number(v))) out[k][f] = Number(v);
    }
  }
  return out;
}

/** Geometria final do slot i: padrão + ajustes salvos pelo mestre (payload.layout). */
function slotGeo(screen, i, layout) {
  const d = GEOMETRY[screen][i];
  const o = screenLayout(layout, screen).slots?.[i];
  if (!o) return d;
  const n = (v, f) => (v !== null && v !== "" && Number.isFinite(Number(v)) ? Number(v) : f);
  return { x: n(o.x, d.x), y: n(o.y, d.y), w: n(o.w, d.w), h: d.h };
}

/* Ícones (gradientes definidos uma vez em DEFS e referenciados por url(#...)) */
const SHIELD_PATH = "M14 2.5 24 6v7c0 5.8-4.2 10.2-10 12.5C8.2 23.2 4 18.8 4 13V6l10-3.5z";
const ICONS = {
  pv: `<svg class="ico" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 25.5C6 19 3 14.6 3 10 3 6.4 5.6 3.8 8.9 3.8c2.3 0 4.2 1.2 5.1 3.2.9-2 2.8-3.2 5.1-3.2C22.4 3.8 25 6.4 25 10c0 4.6-3 9-11 15.5z" fill="url(#t20g-pv)" stroke="#4a0000" stroke-width="1.4" stroke-linejoin="round"/><ellipse cx="9.3" cy="8.6" rx="3.2" ry="2.1" fill="#fff" opacity=".45" transform="rotate(-30 9.3 8.6)"/></svg>`,
  pm: `<svg class="ico" viewBox="0 0 28 28" aria-hidden="true"><path d="${SHIELD_PATH}" fill="url(#t20g-pm)" stroke="#06235e" stroke-width="1.4" stroke-linejoin="round"/><path d="M14 5.2 21 7.8V13c0 4-2.9 7-7 8.9z" fill="#fff" opacity=".22"/><path d="M14 5.2v16.7M7 8l7 6.5L21 8" stroke="#bfe3ff" stroke-width=".8" fill="none" opacity=".6"/></svg>`,
  def: `<svg class="ico" viewBox="0 0 28 28" aria-hidden="true"><path d="${SHIELD_PATH}" fill="url(#t20g-def)" stroke="#c99a2e" stroke-width="2" stroke-linejoin="round"/><path d="M14 6.5 20 8.9V13c0 3.4-2.4 6-6 7.6z" fill="#000" opacity=".16"/></svg>`
};
const DEFS = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="t20g-pv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a5c"/><stop offset="1" stop-color="#b30f0f"/></linearGradient>
  <linearGradient id="t20g-pm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cc0ff"/><stop offset="1" stop-color="#1546b8"/></linearGradient>
  <linearGradient id="t20g-def" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f4f4"/><stop offset="1" stop-color="#8a8a8a"/></linearGradient>
</defs></svg>`;

const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

/** Descobre a tela ("tela1" | "tela2" | "off") pelo nome da cena do OBS. */
function screenForScene(name, scenes = {}) {
  const n = norm(name);
  if (!n) return "off";
  for (const [screen, key] of [["tela1", "scene1"], ["tela2", "scene2"]]) {
    const names = String(scenes?.[key] ?? "").split(",").map(norm).filter(Boolean);
    if (names.some((w) => n === w || n.includes(w))) return screen;
  }
  return "off";
}

let animCount = 0; // quantas animações de perda/ganho já foram disparadas (aparece no ?debug=1)
const pctOf = (s) => (s && s.max > 0 ? Math.max(0, Math.min(100, (s.value / s.max) * 100)) : 0);

function groupHtml(cls, s, withBar) {
  const max = withBar ? `<i>/</i><span class="max">${s.max}</span>` : "";
  const bars = withBar ? `<div class="ghost" style="width:${pctOf(s)}%"></div><div class="fill" style="width:${pctOf(s)}%"></div>` : "";
  const value = withBar ? s.value : s;
  return `<div class="grp ${cls}${cls === "pv" && s.max > 0 && pctOf(s) <= 25 ? " low" : ""}">${ICONS[cls]}${withBar ? `<b class="tmp"${s.temp > 0 ? "" : " hidden"}>${s.temp}</b>` : ""}<div class="bar">${bars}<span class="val"><span class="cur">${value}</span>${max}</span></div></div>`;
}

const applyGeo = (el, g) => {
  el.style.left = g.x + "px";
  el.style.top = g.y + "px";
  el.style.width = g.w + "px";
  el.style.height = g.h + "px";
};

/** Aplica altura, largura e fonte de cada elemento do slot. */
function applyElems(el, es) {
  for (const k of ["pv", "pm", "def"]) {
    const g = el.querySelector(`.grp.${k}`);
    if (!g) continue;
    const e = es[k];
    g.style.cssText = `--bh:${e.h}px;--fs:${e.fs}px;` + (e.w > 0 ? `flex:0 0 ${e.w}px;` : "");
  }
  const nm = el.querySelector(".nm");
  if (nm) nm.style.fontSize = es.nm.fs + "px";
}

/* Fontes personalizadas (instaladas no PC do OBS ou do Google Fonts) */
const loadedFonts = new Set();
const cleanFont = (s) => String(s ?? "").replace(/["'`;{}<>\\]/g, "").trim().slice(0, 60);
function ensureFont(name) {
  if (loadedFonts.has(name) || !document.head) return;
  loadedFonts.add(name);
  const l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(name).replace(/%20/g, "+") + "&display=swap";
  document.head.appendChild(l);
}
/** Registra uma fonte vinda de um arquivo (.ttf/.otf/.woff/.woff2) em base64. A família criada é "T20Font-<papel>". */
const fontKeys = {};
const fontFaces = {};
function registerFontData(role, key, b64) {
  if (fontKeys[role] === key) return Promise.resolve(true);
  fontKeys[role] = key;
  try {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const face = new FontFace(`T20Font-${role}`, bytes.buffer);
    return face.load().then(
      () => {
        if (fontFaces[role]) document.fonts.delete(fontFaces[role]);
        fontFaces[role] = face;
        document.fonts.add(face);
        return true;
      },
      (err) => {
        fontKeys[role] = null;
        console.warn("T20 OBS Overlay | arquivo de fonte inválido", err);
        return false;
      }
    );
  } catch (err) {
    fontKeys[role] = null;
    console.warn("T20 OBS Overlay | não foi possível ler a fonte", err);
    return Promise.resolve(false);
  }
}

function applyFonts(stage, layout) {
  const f = layout?.fonts ?? {};
  const roles = [
    { role: "num", prop: "--font-num", tail: `"Signika", "Segoe UI", sans-serif` },
    { role: "name", prop: "--font-name", tail: `"Pirata One", "Modesto Condensed", Georgia, serif` }
  ];
  for (const { role, prop, tail } of roles) {
    const family = cleanFont(f[role]);
    const hasFile = !!String(f[role + "File"] ?? "").trim();
    if (family) ensureFont(family);
    if (family || hasFile) {
      // arquivo de fonte (se houver) tem prioridade; depois a família digitada; depois o padrão
      const stack = [hasFile ? `"T20Font-${role}"` : "", family ? `"${family}"` : "", tail].filter(Boolean).join(", ");
      stage.style.setProperty(prop, stack);
    } else stage.style.removeProperty(prop);
  }
}

const fxHtml = (list) => (list ?? []).map((n) => `<span class="tag">${esc(n)}</span>`).join("");

function buildSlot(s, g, showNames, showFx) {
  const el = document.createElement("div");
  el.style.cssText = `left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px`;
  if (!s) {
    el.className = "slot empty";
    return el;
  }
  el.className = "slot enter";
  el.innerHTML = `<div class="strip">${groupHtml("pv", s.pv, true)}${groupHtml("pm", s.pm, true)}${groupHtml("def", s.defesa, false)}</div>
    ${showFx ? `<div class="fx">${fxHtml(s.effects)}</div>` : ""}
    ${showNames ? `<div class="nm">${esc(s.name)}</div>` : ""}`;
  return el;
}

/* ---------- Animações ---------- */
function restart(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth; // reinicia a animação CSS
  el.classList.add(cls);
  clearTimeout(el["_t" + cls]);
  el["_t" + cls] = setTimeout(() => el.classList.remove(cls), 1000); // cobre a animação mais longa da classe
}

/** Conta o número até o novo valor (ease-out). */
function tween(el, to, ms = 650) {
  cancelAnimationFrame(el._raf);
  const from = Number(el.textContent);
  if (!Number.isFinite(from) || from === to) {
    el.textContent = to;
    return;
  }
  const t0 = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0) / ms);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}

function floatDelta(grp, diff, cls = "") {
  const d = document.createElement("div");
  d.className = `delta ${diff < 0 ? "neg" : "pos"} ${cls}`;
  d.textContent = diff < 0 ? `${diff}` : `+${diff}`;
  grp.appendChild(d);
  setTimeout(() => d.remove(), 1600);
}

/** Número temporário sobre o ícone. Ao perder: estilhaça (anel dourado + número treme e some). */
function patchTemp(grp, from, to) {
  const tmp = grp.querySelector(".tmp");
  if (!tmp || from === to) return;
  clearTimeout(tmp._t);
  if (to > from) {
    tmp.hidden = false;
    tmp.textContent = to;
    restart(tmp, "tgain");
    floatDelta(grp, to - from, "tmpd");
    return;
  }
  // perda: faísca/anel no ícone + número treme e se desfaz
  animCount++;
  floatDelta(grp, to - from, "tmpd");
  const burst = document.createElement("span");
  burst.className = "burst";
  grp.appendChild(burst);
  setTimeout(() => burst.remove(), 800);
  if (to > 0) {
    tmp.textContent = to;
    restart(tmp, "tloss");
  } else {
    tmp.hidden = false;
    tmp.textContent = from;
    restart(tmp, "tbreak");
    tmp._t = setTimeout(() => { tmp.hidden = true; }, 750);
  }
}

/** Atualiza uma barra (PV/PM): rastro ao perder, "enchimento" ao ganhar, número que conta, balanço/brilho. */
function patchBar(grp, prev, next, isPv) {
  const fill = grp.querySelector(".fill");
  const ghost = grp.querySelector(".ghost");
  const bar = grp.querySelector(".bar");
  const pNew = pctOf(next);
  const pOld = pctOf(prev);
  const diff = next.value - prev.value;

  if (pNew < pOld) {
    // perda: a barra cai rápido e o rastro claro encolhe devagar depois
    ghost.className = "ghost loss";
    fill.style.transition = "width .25s ease-out";
    ghost.style.transition = "width .75s ease-in .45s";
    fill.style.width = ghost.style.width = `${pNew}%`;
  } else if (pNew > pOld) {
    // ganho: o brilho já mostra o novo valor e a barra enche atrás dele
    ghost.className = "ghost gain";
    ghost.style.transition = "width .2s ease-out";
    fill.style.transition = "width .8s ease-out .15s";
    ghost.style.width = fill.style.width = `${pNew}%`;
  }
  if (diff !== 0) {
    animCount++;
    restart(bar, diff < 0 ? "hit" : "heal");
    floatDelta(grp, diff);
  }
  tween(grp.querySelector(".cur"), next.value);
  grp.querySelector(".max").textContent = next.max;
  patchTemp(grp, prev.temp || 0, next.temp || 0);
  if (isPv) grp.classList.toggle("low", next.max > 0 && pNew <= 25);
}

function patchSlot(el, prev, next) {
  const grps = el.querySelectorAll(".grp");
  patchBar(grps[0], prev.pv, next.pv, true);
  patchBar(grps[1], prev.pm, next.pm, false);
  if (prev.defesa !== next.defesa) {
    const val = grps[2].querySelector(".val");
    grps[2].querySelector(".cur").textContent = next.defesa;
    restart(val, "pop");
  }
  const fx = el.querySelector(".fx");
  const list = next.effects ?? [];
  if (fx && fx.dataset.k !== list.join("|")) {
    const old = (fx.dataset.k ?? "").split("|");
    fx.dataset.k = list.join("|");
    fx.innerHTML = fxHtml(list);
    fx.querySelectorAll(".tag").forEach((tag) => { if (!old.includes(tag.textContent)) tag.classList.add("new"); });
  }
  const nm = el.querySelector(".nm");
  if (nm && nm.textContent !== next.name) nm.textContent = next.name;
}

const snapshot = (s) => (s ? JSON.parse(JSON.stringify(s)) : null);

/** Cria o overlay (um palco 1920x1080 escalado para a janela). */
function createOverlay() {
  let root = null;
  let stage = null;
  let curScreen = null;
  let curNames = null;
  let els = [];
  let prev = [];

  const fit = () => {
    if (!stage) return;
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `scale(${s})`;
  };

  function mount() {
    document.documentElement.classList.add("t20-obs-on");
    document.body.classList.add("t20-obs-on");
    root = document.createElement("div");
    root.id = "t20-obs-overlay";
    root.insertAdjacentHTML("afterbegin", DEFS);
    stage = document.createElement("div");
    root.appendChild(stage);
    document.body.appendChild(root);
  }

  window.addEventListener("resize", fit);

  return {
    get root() {
      return root;
    },
    /** screen = "tela1" | "tela2" | null (null = overlay vazio e transparente). */
    show(screen, payload) {
      if (!root) mount();
      if (!screen || !payload) {
        stage.className = "t20obs-stage";
        stage.innerHTML = "";
        curScreen = curNames = null;
        els = [];
        prev = [];
        return;
      }
      const showNames = !!payload.showNames;
      const showFx = !!payload.showEffects;
      const mode = `${showNames}|${showFx}`;
      const slots = GEOMETRY[screen].map((_, i) => payload.slots?.[i] ?? null);
      const es = elemsFor(screen, payload.layout);
      applyFonts(stage, payload.layout);

      if (curScreen !== screen || curNames !== mode) {
        // tela nova (ou nomes ligados/desligados): monta tudo, com animação de entrada
        stage.className = `t20obs-stage ${screen}`;
        stage.innerHTML = "";
        els = GEOMETRY[screen].map((_, i) => stage.appendChild(buildSlot(slots[i], slotGeo(screen, i, payload.layout), showNames, showFx)));
        els.forEach((el) => applyElems(el, es));
        curScreen = screen;
        curNames = mode;
        els.forEach((el, i) => { const fx = el.querySelector(".fx"); if (fx) fx.dataset.k = (slots[i]?.effects ?? []).join("|"); });
      } else {
        // mesma tela: atualiza no lugar (é o que permite animar as mudanças)
        slots.forEach((s, i) => {
          if (!!s !== !!prev[i]) {
            const fresh = buildSlot(s, slotGeo(screen, i, payload.layout), showNames, showFx);
            stage.replaceChild(fresh, els[i]);
            applyElems(fresh, es);
            els[i] = fresh;
          } else if (s) {
            patchSlot(els[i], prev[i], s);
          }
        });
        // posição/largura ajustadas no menu valem ao vivo
        els.forEach((el, i) => {
          applyGeo(el, slotGeo(screen, i, payload.layout));
          applyElems(el, es);
        });
      }
      prev = slots.map(snapshot);
      fit();
    },
    hide() {
      document.documentElement.classList.remove("t20-obs-on");
      document.body.classList.remove("t20-obs-on");
      root?.remove();
      root = stage = null;
      curScreen = curNames = null;
      els = [];
      prev = [];
    }
  };
}

/* Página independente do overlay (sem login). Recebe os dados do Foundry (navegador do mestre)
   pelo obs-websocket: evento "t20obs-data" disparado pelo OBS nesta Fonte de Navegador.
   Parâmetros de URL (opcionais):  ?tela=1 | ?tela=2  (força uma tela)   ?debug=1  (mostra o estado) */
(function () {
  var EVENT_NAME = "t20obs-data";
  var STALE_MS = 60000; // sem dados do Foundry por 1 min → esconde (evita mostrar números velhos)

  var params = new URLSearchParams(window.location.search);
  var forcedMap = { 1: "tela1", tela1: "tela1", 2: "tela2", tela2: "tela2" }[(params.get("tela") || "").toLowerCase()];
  var forced = forcedMap || null;
  var debug = params.has("debug");

  var overlay = createOverlay();
  var last = null;
  var lastAt = 0;
  var obsScene = null;
  var dbg = null;

  overlay.show(null, null);
  if (debug) {
    dbg = document.createElement("div");
    dbg.style.cssText = "position:absolute;left:8px;bottom:8px;padding:4px 8px;background:rgba(0,0,0,.7);color:#fff;font:14px sans-serif;border-radius:4px";
    overlay.root.appendChild(dbg);
  }

  function draw() {
    var fresh = last && Date.now() - lastAt < STALE_MS;
    var scene = (last && last.scene) || obsScene;
    var screen = forced || (last ? screenForScene(scene, last.scenes) : "off");
    overlay.show(fresh && screen !== "off" ? screen : null, last);
    if (dbg) {
      dbg.textContent = !last
        ? "v" + (window.T20OBS_VERSION || "?") + " · aguardando dados do Foundry… (cena OBS: " + (scene || "?") + ")"
        : "v" + (window.T20OBS_VERSION || "?") + " · dados há " + Math.round((Date.now() - lastAt) / 1000) + "s · cena: " + (scene || "?") + " · tela: " + screen + " · animações disparadas: " + animCount;
    }
  }

  window.addEventListener(EVENT_NAME, function (e) {
    last = e.detail;
    lastAt = Date.now();
    draw();
  });

  // Se o OBS permitir, também acompanha a cena por conta própria (fallback)
  if (window.obsstudio) {
    if (window.obsstudio.getCurrentScene) window.obsstudio.getCurrentScene(function (s) { obsScene = s && s.name; draw(); });
    window.addEventListener("obsSceneChanged", function (e) { obsScene = e.detail && e.detail.name; draw(); });
  }

  /* Modo de teste (?teste=1): simula dano, cura, gasto de mana e mudança de Defesa, sem precisar do Foundry.
     Serve para conferir as animações direto no OBS. Use com ?tela=1 ou ?tela=2. */
  if (params.has("teste")) {
    forced = forced || "tela1";
    var names = ["Thanvaar", "Rurik", "Ssaarok", "Kael", "Lyra"];
    var mx = [[60, 30], [48, 12], [70, 20], [40, 40], [38, 34]];
    var st = [[42, 18, 28, 5, 0], [30, 6, 25, 0, 4], [70, 20, 30, 0, 0], [31, 22, 24, 0, 0], [20, 30, 23, 0, 0]];
    var steps = [[0, 0, 25], [0, 1, 26], [1, 0, 48], [0, 2, 29], [3, 1, 5], [0, 0, 8], [0, 0, 60], [2, 0, 40], [1, 1, 12], [4, 0, 5], [4, 0, 38], [0, 1, 2], [0, 3, 2], [0, 3, 0], [0, 3, 9], [0, 4, 6], [1, 4, 1], [1, 4, 0]];
    var n = 0;
    var tick = function () {
      if (n > 0) {
        var s = steps[(n - 1) % steps.length];
        st[s[0]][s[1]] = s[2];
      }
      n++;
      last = {
        v: 1, scene: null, scenes: {}, showNames: params.has("nomes"), showEffects: params.has("efeitos"),
        slots: st.map(function (a, i) {
          return { name: names[i], pv: { value: a[0], max: mx[i][0], temp: a[3] }, pm: { value: a[1], max: mx[i][1], temp: a[4] }, defesa: a[2], effects: i === 0 ? (n % 4 < 2 ? ["Abalado", "Em Chamas"] : ["Abalado"]) : i === 1 ? ["Atordoado"] : [] };
        })
      };
      lastAt = Date.now();
      draw();
    };
    tick();
    setInterval(tick, 2500);
  }

  /* Fontes de arquivo enviadas pelo Foundry (guardadas no navegador para recarregar rápido) */
  var FONT_KEY = "t20obs-fonts";
  var fontStore = {};
  function saveFonts() {
    try { localStorage.setItem(FONT_KEY, JSON.stringify(fontStore)); } catch (err) { /* cota cheia: segue sem cache */ }
  }
  /* Só entra no cache o que realmente carregou como fonte */
  function applyFonts(fonts, persist) {
    Object.keys(fonts || {}).forEach(function (role) {
      var f = fonts[role];
      if (!f || !f.b64) return;
      registerFontData(role, f.key, f.b64).then(function (ok) {
        if (ok && persist) { fontStore[role] = f; saveFonts(); }
        if (ok && !persist) fontStore[role] = f;
      });
    });
  }
  try { applyFonts(JSON.parse(localStorage.getItem(FONT_KEY) || "{}"), false); } catch (e) { /* sem cache */ }
  window.addEventListener("t20obs-fonts", function (e) {
    var d = e.detail;
    if (d && d.fonts) applyFonts(d.fonts, true);
  });

  setInterval(draw, 2000);
})();

</script></body></html>
